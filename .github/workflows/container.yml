name: Container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read product version
        id: product
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' package.json)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0e4daef72506b22b7bfdcc5d3d47b5fe997 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6e3cf474489f78a542829d33feb3 # v3.10.18

      - name: Resolve short commit SHA
        id: git
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@4711f139f779901aabedaecb7bef8fde7db0bcd0 # v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.product.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.git.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
