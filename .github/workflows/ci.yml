name: CI

# Every pull request runs the checks for the areas it changed, whatever its
# base, so a pull request stacked on a feature branch is checked too. A release
# pull request into main also runs the e2e suites once those checks pass. A
# push to main or a release branch runs the Rust job only, so new pull requests
# have a Cargo cache to start from.
on:
  pull_request:
  push:
    branches:
      - main
      - "release/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.0"
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
      app: ${{ steps.filter.outputs.app }}
      ui: ${{ steps.filter.outputs.ui }}
      docs: ${{ steps.filter.outputs.docs }}
      e2e_types: ${{ steps.filter.outputs.e2e_types }}
      repo: ${{ steps.filter.outputs.repo }}
      suites: ${{ steps.filter.outputs.suites }}
    steps:
      # A pull request run checks out the merge commit. Its first parent is
      # the base branch, so two commits are enough to list what changed.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Pick the jobs to run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          checks=false app=false ui=false docs=false
          e2e_types=false repo=false suites=false

          case "$EVENT_NAME" in
            pull_request)
              files=$(git diff --name-only HEAD^1 HEAD)
              hit() {
                if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi
              }
              # Files every area depends on, plus this workflow itself.
              shared='^(package\.json|bun\.lock|\.github/workflows/ci\.yml)$'
              checks=true
              # The binary embeds ui/dist, so a UI change reruns the Rust job.
              app=$(hit "^(app|ui)/|$shared")
              ui=$(hit "^ui/|$shared")
              docs=$(hit "^docs/|$shared")
              e2e_types=$(hit "^e2e/|$shared")
              repo=$(hit '^(\.github|scripts)/')
              if [[ "$BASE_REF" == main && "$HEAD_REF" == release/* ]]; then
                suites=true
              fi
              ;;
            push)
              app=true
              ;;
            *)
              checks=true app=true ui=true docs=true
              e2e_types=true repo=true suites=true
              ;;
          esac

          {
            echo "checks=$checks"
            echo "app=$app"
            echo "ui=$ui"
            echo "docs=$docs"
            echo "e2e_types=$e2e_types"
            echo "repo=$repo"
            echo "suites=$suites"
          } | tee -a "$GITHUB_OUTPUT"

  repo:
    name: Format and repository checks
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier
        run: bun run format:repo:check

      - name: Typecheck the e2e suites
        if: needs.changes.outputs.e2e_types == 'true'
        run: bun run typecheck:e2e

      - name: Test the release scripts and GitHub templates
        if: needs.changes.outputs.repo == 'true'
        run: bun run test:github

      - name: Lint workflows and release scripts
        if: needs.changes.outputs.repo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint"
          shellcheck scripts/release/*.sh

  ui:
    name: UI lint, tests and build
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ui

      - name: Unit tests
        run: bun run test:ui

      # The build runs the typecheck first, so there is no separate step.
      - name: Typecheck and build
        run: bun run build:ui

  app:
    name: Rust fmt, clippy and tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "${RUST_VERSION}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app -> target
          key: ci
          cache-workspace-crates: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      # The server embeds the Admin UI from ui/dist/ at compile time, and the
      # tests serve its index.html and favicon.
      - name: Build Admin UI
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run build:ui

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets --all-features

  docs:
    name: Docs tests and build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test:docs

      - name: Build
        run: bun run build:docs

  # Format, lint, typecheck and unit tests ran in the jobs above on this same
  # commit, so this job only builds the release binary and runs the suites.
  # A job is skipped when one it needs was skipped, hence the explicit
  # condition: run unless a check failed or the run was cancelled.
  e2e:
    name: E2E suites
    needs: [changes, repo, ui, app, docs]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.suites == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app -> target
          key: e2e
          cache-workspace-crates: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install e2e dependencies
        run: |
          bun install --frozen-lockfile
          bun run --cwd e2e install:browsers --with-deps

      # Builds the Admin UI and the release binary, then runs every suite.
      - name: Run e2e suites
        env:
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
        run: bun run test:e2e --agent

      # The HTML report plus traces, screenshots and videos of failed tests.
      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # One result for the whole run. It always runs, so a branch rule can require
  # it even when the jobs above were skipped for an unchanged area.
  passed:
    name: CI passed
    needs: [changes, repo, ui, app, docs, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          echo "Job results: $RESULTS"
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            exit 1
          fi
